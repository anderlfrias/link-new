name: Publicar imágenes

# Al crear un tag de versión (`v1.2.3`, ver VERSIONING.md) construye las imágenes del backend y del
# frontend y las publica en GHCR con el número de versión: ghcr.io/<dueño>/link-backend:1.2.3 y
# ghcr.io/<dueño>/link-frontend:1.2.3. Con eso, actualizar una instalación con Docker es cambiar el
# número de versión, y un proveedor de autenticación externo se agrega extendiendo la imagen del
# backend sin tocar su código (docs/auth-providers.md).
#
# Ejecutarlo a mano (Actions > Publicar imágenes > Run workflow) construye las dos imágenes con los
# mismos pasos pero NO publica nada: sirve para probar este workflow, por ejemplo después de
# actualizar una acción, sin crear un tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Imagen ${{ matrix.image }}
    runs-on: ubuntu-24.04
    # Solo este job escribe en GHCR.
    permissions:
      contents: read
      packages: write
    env:
      # Con un tag se publica; con la ejecución manual solo se construye.
      PUBLISH: ${{ github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo, para comprobar que el tag está en main.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Un tag que no coincide con la versión de los package.json publicaría una imagen con el
      # número equivocado: se corta antes de construir nada. Las pruebas de coherencia comprueban
      # además que los tres package.json, el lockfile, la versión de la interfaz y el CHANGELOG
      # dicen lo mismo.
      - name: El tag coincide con la versión
        run: |
          node --test scripts/release-consistency.test.js
          if [ "$PUBLISH" = "true" ]; then
            test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          fi
      # Solo se publica lo que ya pasó por main (y por su CI): un tag sobre una rama sin revisar
      # no debe terminar en GHCR.
      - name: El tag está en main
        if: env.PUBLISH == 'true'
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/link-${{ matrix.image }}
          # 1.2.3, 1.2 y (salvo en prereleases) latest. El tag completo, `v1.2.3`, no se publica.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # El contexto es la raíz del repo (npm workspaces), como en `docker build -f <imagen>/Dockerfile .`.
      # El frontend embebe las URLs de la API en el build: esta imagen sale con las de localhost, y quien
      # la use detrás de un dominio tiene que reconstruirla con las suyas (ver README.md).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
